name: Aurora tests
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  schedule:
    - cron: 0 22 * * 0 # run workflow every sunday
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
  AURORA_STACK_NAME: AuroraTestInfrastructure
  AWS_REGION: us-east-2
permissions:
  id-token: write # This is required for requesting the JWT
defaults:
  run:
    shell: pwsh
concurrency: aurora_tests
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for secrets
        env:
          SECRETS_AVAILABLE: ${{ secrets.SECRETS_AVAILABLE }}
        shell: pwsh
        run: exit $(If ($env:SECRETS_AVAILABLE -eq 'true') { 0 } Else { 1 })
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AURORA_CI_ROLE }}
          role-session-name: AuroraCI
          aws-region: us-east-2
          role-duration-seconds: 10800

      - name: Build
        shell: bash
        run: dotnet build src --configuration Release
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NuGet packages
          path: nugets/
          retention-days: 7

      - name: Install CDK
        id: install-cdk
        shell: bash
        run: npm install -g aws-cdk

      # Removes a stack a previous run failed to tear down; does nothing when no stack exists.
      - name: Remove leftover infrastructure
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cd src/AuroraSetup
          cdk destroy --force -c stackName=$Env:AURORA_STACK_NAME

      - name: Setup Aurora
        id: aurora-setup
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cd src/AuroraSetup
          cdk deploy -c stackName=$Env:AURORA_STACK_NAME --outputs-file cdk-outputs.json

          $outputs = (Get-Content cdk-outputs.json | ConvertFrom-Json).$Env:AURORA_STACK_NAME

          $postgresSecrets = aws secretsmanager get-secret-value --secret-id $outputs.PostgreSqlSecretArn --region $Env:AWS_REGION --query SecretString --output text | ConvertFrom-Json
          $postgresHost = $postgresSecrets.host
          $postgresUser = $postgresSecrets.username
          $postgresPassword = $postgresSecrets.password
          $postgresConnectionString = "Host=$postgresHost;User ID=$postgresUser;Password=$postgresPassword;Port=5432;Database=postgres;"
          "PostgreSqlConnectionString=$postgresConnectionString" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append

          $mysqlSecrets = aws secretsmanager get-secret-value --secret-id $outputs.MySqlSecretArn --region $Env:AWS_REGION --query SecretString --output text | ConvertFrom-Json
          $mysqlHost = $mysqlSecrets.host
          $mysqlUser = $mysqlSecrets.username
          $mysqlPassword = $mysqlSecrets.password

          #NOTE This part of the connection string is important to ensure protection from session state contamination: ConnectionReset=true;
          $mysqlConnectionString = "Server=$mysqlHost;Uid=$mysqlUser;Pwd=$mysqlPassword;Port=3306;Database=postgres;Initial Catalog=nservicebus;AllowUserVariables=True;AutoEnlist=false;ConnectionReset=true;Connect Timeout=60"
          "MySQLConnectionString=$mysqlConnectionString" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append

          echo "Creating nservicebus database"
          mysql --host=$mysqlHost --user=$mysqlUser --password=$mysqlPassword -D mysql -e "create database if not exists nservicebus ;"

      - name: Run tests
        uses: Particular/run-tests-action@v1.9.0

      - name: Teardown infrastructure
        if: ${{ always() }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cd src/AuroraSetup
          cdk destroy --force -c stackName=$Env:AURORA_STACK_NAME
