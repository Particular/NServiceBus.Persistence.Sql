name: CI
on:
  push:
    branches:
      - master
      - release-*
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
defaults:
  run:
    shell: pwsh
jobs:
  build:
    name: ${{ matrix.name }}-${{ matrix.engine }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        engine: [SqlServer, MySql, PostgreSql, Oracle]
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
      fail-fast: false
    steps:
      - name: Check for secrets
        env:
          SECRETS_AVAILABLE: ${{ secrets.SECRETS_AVAILABLE }}
        run: exit $(If ($env:SECRETS_AVAILABLE -eq 'true') { 0 } Else { 1 })
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.2.0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src --configuration Release -graph
      - name: Upload packages
        if: matrix.name == 'Windows' && matrix.engine == 'SqlServer'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuGet packages
          path: nugets/
          retention-days: 7
      - name: Azure login
        uses: azure/login@v3.1.0
        if: matrix.engine == 'Oracle' && matrix.name == 'Windows'
        with:
          creds: ${{ secrets.AZURE_ACI_CREDENTIALS }}
      - name: Setup SQL Server
        if: matrix.engine == 'SqlServer'
        uses: Particular/install-sql-server-action@v3.0.0
        with:
          connection-string-env-var: SQLServerConnectionString
          catalog: nservicebus
          extra-params: "Encrypt=False;"
          enable-distributed-transactions: true
      - name: Setup PostgreSql 15.x
        if: matrix.engine == 'PostgreSql'
        uses: Particular/setup-postgres-action@v3.0.0
        with:
          connection-string-name: PostgreSqlConnectionString
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup MySQL
        if: matrix.engine == 'MySql'
        uses: Particular/setup-mysql-action@v1.0.0
        with:
          connection-string-name: MySQLConnectionString
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}          
      - name: Setup Oracle
        id: setup-oracle
        if: matrix.engine == 'Oracle'
        uses: Particular/setup-oracle-action@v2.0.0
        with:
          connection-string-name: OracleConnectionString
          init-script: ./.github/workflows/scripts/setup-oracle-database-users-and-permissions.sql
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare Connection Strings for Oracle
        if: matrix.engine == 'Oracle'
        run: |
          $connectionString = $Env:OracleConnectionString
          "OracleConnectionString=$($connectionString.Replace('system', 'particular'))" >> $Env:GITHUB_ENV
          "OracleConnectionString_Particular2=$($connectionString.Replace('system', 'particular2'))" >> $Env:GITHUB_ENV
      - name: Run tests
        uses: Particular/run-tests-action@v1.9.0
